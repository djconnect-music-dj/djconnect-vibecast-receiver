<title>Join VibeCast Live</title>
<link rel="icon" href="/brand-mark-32.png"><link rel="stylesheet" href="/join.css">

<body>
<main>
 <img src="/brand-mark-32.png" alt="" width="48" height="48">
 <h1 id="join-title">Join VibeCast Live</h1>
 <p id="join-intro">Open DJConnect to confirm joining this session as a guest.</p>
 <button id="join-open" type="button" disabled>Open DJConnect</button>
 <p id="join-status" role="status" aria-live="polite"></p>
 <p id="join-note">Joining is confirmed in the app. No PIN is needed.</p>
 <a id="join-install" href="https://apps.apple.com/app/id6832635823" rel="noreferrer noopener">Install DJConnect</a>
 <p id="join-rescan">After installing the app, scan the current QR code on the TV again.</p>
 <p id="join-privacy">This page does not join the session or retain your invitation.</p>
 <noscript>Open DJConnect, then scan the current QR code again. JavaScript is needed to transfer this invitation.</noscript>
</main>
