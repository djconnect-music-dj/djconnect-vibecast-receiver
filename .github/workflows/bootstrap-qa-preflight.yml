name: Verify isolated VibeCast QA candidate
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current protected main SHA
        required: true
        type: string
      artifact_run_id:
        description: Successful Verify receiver push run for that SHA
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'pcvantol/djconnect-vibecast-receiver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the CI archive, QA artifact and anonymous Access boundary
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: node scripts/preflight_qa_pages.mjs
